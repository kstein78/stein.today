# Сборка на каждый push и PR. Выкладка на сервер — только из main и только если заданы секреты.
# Секреты (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST  — 2.28.137.150
#   DEPLOY_USER  — пользователь SSH на сервере
#   DEPLOY_KEY   — приватный SSH-ключ (публичный — в ~/.ssh/authorized_keys на сервере)
#   DEPLOY_PATH  — папка сайта на сервере, например /var/www/stein.today
#   DEPLOY_PORT  — (необязательно) порт SSH, по умолчанию 22
name: build-and-deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/check-links.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_KEY != '' }}
    steps:
      - name: Секреты не заданы — выкладка пропущена
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::Задайте DEPLOY_HOST, DEPLOY_USER, DEPLOY_KEY, DEPLOY_PATH, чтобы включить выкладку."
      - uses: actions/download-artifact@v4
        if: env.HAS_SECRETS == 'true'
        with:
          name: dist
          path: dist
      - name: rsync на сервер
        if: env.HAS_SECRETS == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/id_deploy -p $PORT" dist/ "$USER@$HOST:$DEST/"
