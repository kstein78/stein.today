# Пример виртуального хоста nginx для stein.today на 2.28.137.150.
# Сертификат: certbot --nginx -d stein.today -d www.stein.today
server {
    listen 80;
    server_name stein.today www.stein.today;
    return 301 https://stein.today$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.stein.today;
    ssl_certificate     /etc/letsencrypt/live/stein.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stein.today/privkey.pem;
    return 301 https://stein.today$request_uri;
}
server {
    listen 443 ssl http2;
    server_name stein.today;
    ssl_certificate     /etc/letsencrypt/live/stein.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stein.today/privkey.pem;

    root /var/www/stein.today;
    index index.html;
    error_page 404 /404.html;

    location / { try_files $uri $uri/ =404; }
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(png|svg|woff2)$ { expires 30d; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
}
